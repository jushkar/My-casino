<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Staff sign in</title></head><body>
<main><h1>Staff sign in</h1><p>Use an existing invited staff account. Public registration is unavailable.</p>
<form id="login"><label>Email <input name="email" type="email" autocomplete="username" required></label><label>Password <input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form>
<form id="mfa" hidden><label>Authenticator code <input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" required></label><button>Verify</button></form><p id="message" role="status"></p></main><script src="/staff/login.js" defer></script></body></html>
