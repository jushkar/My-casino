<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Owner foundation</title></head><body><main><h1>Owner foundation</h1><p>Private nonmonetary test records. No wallet management or money movement.</p><p id="expiry"></p><ul id="records"></ul><form id="record"><label>Note <input name="note" maxlength="200" required></label><button>Save note</button></form><p>Your unsaved note stays in this tab during expiry or an outage. It is not saved in browser storage. Reloading or closing this tab discards it.</p><form id="stepup" hidden><label>Fresh authenticator code <input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" required></label><button>Verify code</button></form><a id="signin" href="/owner/login" target="_blank" rel="noopener" hidden>Sign in in a new tab, then return here</a><button id="retry">Refresh access</button><button id="logout">Sign out</button><p id="message" role="status"></p></main><script src="/owner/panel.js" defer></script></body></html>
